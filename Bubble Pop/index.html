<!-- ======================================================================
     BUBBLE POP — throw darts at a wall of floating bubbles.
     Trigger (or left-click) throws a dart along the line you are aiming;
     it flies with a gentle arc and bursts the first bubble it passes
     through. Clear the wall and a new one floats up.
     ====================================================================== -->
<script>
// A sign: text drawn on a 2D canvas, used as a texture on a flat plane.
// A-Frame's own `text` fetches a font from a CDN at runtime, which fails in a
// published build, so every word in this scene is painted here instead.
AFRAME.registerComponent('canvas-sign', {
  schema: {
    width:  { default: 1.6 },
    height: { default: 0.4 },
    bg:     { default: '#15324d' },
    fg:     { default: '#ffffff' },
    subfg:  { default: '#a9cfee' },
    title:  { default: '' },
    sub:    { default: '' }
  },
  init: function () {
    var THREE = AFRAME.THREE, d = this.data;
    var px = 700;                                   // pixels per metre: about twice what the sign covers at 3 m
    var c = document.createElement('canvas');
    c.width  = Math.min(2048, Math.round(d.width  * px));
    c.height = Math.min(2048, Math.round(d.height * px));
    this.canvas = c;
    this.ctx = c.getContext('2d');
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    this.texture = tex;
    this.el.setObject3D('mesh', new THREE.Mesh(
      new THREE.PlaneGeometry(d.width, d.height),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true })   // unlit: the sign reads the same wherever it hangs
    ));
    this.draw();
  },
  update: function () { if (this.ctx) this.draw(); },
  draw: function () {
    var d = this.data, c = this.canvas, g = this.ctx;
    var w = c.width, h = c.height, r = h * 0.18;
    g.clearRect(0, 0, w, h);
    g.fillStyle = d.bg;
    g.beginPath();
    g.moveTo(r, 0); g.lineTo(w - r, 0); g.quadraticCurveTo(w, 0, w, r);
    g.lineTo(w, h - r); g.quadraticCurveTo(w, h, w - r, h);
    g.lineTo(r, h); g.quadraticCurveTo(0, h, 0, h - r);
    g.lineTo(0, r); g.quadraticCurveTo(0, 0, r, 0);
    g.closePath(); g.fill();
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (d.sub) {
      g.fillStyle = d.fg;    g.font = 'bold ' + Math.round(h * 0.38) + 'px sans-serif';
      g.fillText(d.title, w / 2, h * 0.36);
      g.fillStyle = d.subfg; g.font = Math.round(h * 0.19) + 'px sans-serif';
      g.fillText(d.sub, w / 2, h * 0.75);
    } else {
      g.fillStyle = d.fg;    g.font = 'bold ' + Math.round(h * 0.46) + 'px sans-serif';
      g.fillText(d.title, w / 2, h * 0.52);
    }
    this.texture.needsUpdate = true;
  }
});

// The game. Its entity sits at the origin, so a bubble's local position is
// also its world position — the dart hit-test relies on that.
//
// The darts are real objects: cannon-es bodies lying on two racks beside the
// player. Reach out, squeeze to pick one up, swing and let go — the throw is
// whatever the hand was doing at the moment of release. The bubbles stay
// decoration: each dart's tip is tested against the segment it swept this
// frame, which no physics step can skip past.
AFRAME.registerComponent('bubble-pop-game', {
  schema: {
    cols: { default: 5 },
    rows: { default: 3 },
    z:    { default: -2.9 }        // the wall stands just under 3 m in front of the player
  },

  init: function () {
    var self = this, THREE = AFRAME.THREE;

    this.COLORS    = ['#ff9db0', '#ffcf8a', '#9fe6c7', '#9fc9ff', '#d9b3ff'];
    this.RADIUS    = 0.19;
    this.TOLERANCE = 0.05;         // a little forgiveness on top of the bubble's radius
    this.REBUILD_MS = 1200;
    this.ROUND_SECS = 30;          // half a minute a round: long enough to find your aim, short enough to want another go

    this.GRAVITY    = 6.5;         // m/s² — a shade lighter than earth, so a thrown dart still flies roughly where it was aimed
    this.DART_HALF  = 0.032;       // half the dart's width; its half-length is below
    this.DART_LONG  = 0.11;
    this.RACK_TOP   = 0.9;         // tabletop height, about a kitchen worktop
    this.GRAB_REACH = 0.32;        // how near a hand has to be to pick a dart up
    this.MAX_SPEED  = 12;          // cannon-es has no continuous collision: 15 m/s is the ceiling at 120 Hz, so stay under it
    this.THROW_GAIN = 1.35;        // a hand trail reads about two-thirds of the real speed; this puts it back
    this.REST_SECS  = 2.2;         // a dart lying still this long goes home to the rack
    this.TRAIL      = 14;          // ~230 ms of hand positions at 60 Hz

    this.bubbles = [];
    this.darts   = [];
    this.popped  = 0;
    this.thrown  = 0;
    this.rebuildAt = 0;
    this.remaining = this.ROUND_SECS;
    this.running   = false;        // the clock waits for the first throw, so nobody loses time reading the signs
    this.over      = false;
    this.shownSecs = -1;
    this.held    = { left: null, right: null, head: null };
    this.trails  = { left: [], right: [], head: [] };

    // scratch vectors, reused every frame
    this._a = new THREE.Vector3(); this._b = new THREE.Vector3();
    this._c = new THREE.Vector3(); this._d = new THREE.Vector3();
    this._q = new THREE.Quaternion();
    this._up = new THREE.Vector3(0, 1, 0);

    this.initPhysics();
    this.buildWall();
    this.buildRacks();
    this.updateSign();
    this.updateClock();

    // --- input ------------------------------------------------------------
    // Squeeze near a dart to take it, let go to throw. A trigger aimed at a
    // sign is still a press — the kit's own click handling deals with that.
    ['left', 'right'].forEach(function (hand) {
      var el = document.querySelector('#' + hand + '-hand');
      if (!el) return;
      el.addEventListener('triggerdown', function () { self.grab(hand); });
      el.addEventListener('triggerup',   function () { self.release(hand); });
      el.addEventListener('gripdown',    function () { self.grab(hand); });
      el.addEventListener('gripup',      function () { self.release(hand); });
    });

    // A-Frame only emits triggerdown for controller profiles it recognises, so
    // listen to WebXR's own select/squeeze as well. grab() ignores a second
    // grab on a hand that is already holding something, so the two can overlap.
    this.el.sceneEl.addEventListener('enter-vr', function () {
      setTimeout(function () {
        var scene = self.el.sceneEl;
        var s = scene.xrSession || (scene.renderer && scene.renderer.xr && scene.renderer.xr.getSession());
        if (!s || s.__bubblePopBound) return;
        s.__bubblePopBound = true;
        var handOf = function (e) { return (e && e.inputSource && e.inputSource.handedness) === 'left' ? 'left' : 'right'; };
        s.addEventListener('selectstart',  function (e) { self.grab(handOf(e)); });
        s.addEventListener('selectend',    function (e) { self.release(handOf(e)); });
        s.addEventListener('squeezestart', function (e) { self.grab(handOf(e)); });
        s.addEventListener('squeezeend',   function (e) { self.release(handOf(e)); });
      }, 0);
    });

    // Desktop has no arms: holding the left button takes the nearest dart and
    // holds it out in front, letting go throws it along the centre ring.
    this.onMouseDown = function (e) {
      var scene = self.el.sceneEl;
      if (e.button !== 0) return;
      if (scene.renderer && scene.renderer.xr && scene.renderer.xr.isPresenting) return;
      if (!scene.canvas || e.target !== scene.canvas) return;
      if (self.aimingAtSign(document.querySelector('#gaze'))) return;
      self.grab('head');
    };
    this.onMouseUp = function (e) {
      if (e.button !== 0) return;
      self.release('head');
    };
    document.addEventListener('mousedown', this.onMouseDown);
    document.addEventListener('mouseup', this.onMouseUp);

    var again = document.querySelector('#new-wall');
    if (again) again.addEventListener('click', function () { self.newGame(); });
  },

  remove: function () {
    document.removeEventListener('mousedown', this.onMouseDown);
    document.removeEventListener('mouseup', this.onMouseUp);
  },

  // --- physics ------------------------------------------------------------
  initPhysics: function () {
    var world = new CANNON.World({ gravity: new CANNON.Vec3(0, -this.GRAVITY, 0) });
    world.allowSleep = true;                         // a dart lying still costs nothing
    world.defaultContactMaterial.friction = 0.45;
    world.defaultContactMaterial.restitution = 0.12; // darts land with a small knock, they don't bounce away
    var floor = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    floor.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(floor);
    this.world = world;
  },

  // --- the racks of darts, one either side, within arm's reach -------------
  buildRacks: function () {
    var self = this, TOP = this.RACK_TOP;
    [-1, 1].forEach(function (side) {
      var cx = side * 0.55, cz = -0.5;      // an arm's length away, half in view when looking ahead

      var rack = document.createElement('a-entity');
      rack.classList.add('rack');
      rack.setAttribute('position', cx + ' 0 ' + cz);

      var top = document.createElement('a-box');
      top.setAttribute('width', 0.5);
      top.setAttribute('height', 0.06);
      top.setAttribute('depth', 0.34);
      top.setAttribute('color', '#c98f5a');
      top.setAttribute('position', '0 ' + TOP + ' 0');

      var leg = document.createElement('a-cylinder');
      leg.setAttribute('radius', 0.055);
      leg.setAttribute('height', TOP - 0.03);
      leg.setAttribute('color', '#a8703f');
      leg.setAttribute('position', '0 ' + ((TOP - 0.03) / 2) + ' 0');

      var label = document.createElement('a-entity');
      label.setAttribute('position', '0 ' + (TOP + 0.32) + ' 0.02');
      label.setAttribute('canvas-sign', { width: 0.5, height: 0.14, bg: '#1d4a6e', title: 'Darts' });

      rack.appendChild(top);
      rack.appendChild(leg);
      rack.appendChild(label);
      self.el.appendChild(rack);

      var body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(0.25, 0.03, 0.17)) });
      body.position.set(cx, TOP, cz);
      self.world.addBody(body);

      // three to a rack, lying across it with their tips toward the wall
      for (var i = 0; i < 3; i++) {
        self.makeDart(cx + (i - 1) * 0.15, TOP + 0.03 + self.DART_HALF, cz);
      }
    });
  },

  makeDart: function (x, y, z) {
    var THREE = AFRAME.THREE;

    var el = document.createElement('a-entity');
    el.classList.add('dart');
    var shaft = document.createElement('a-cone');
    shaft.setAttribute('radius-bottom', 0.03);
    shaft.setAttribute('radius-top', 0.004);
    shaft.setAttribute('height', 0.22);
    shaft.setAttribute('segments-radial', 8);
    shaft.setAttribute('segments-height', 1);
    shaft.setAttribute('color', '#f5f7fa');
    var tail = document.createElement('a-sphere');
    tail.setAttribute('radius', 0.035);
    tail.setAttribute('segments-width', 10);
    tail.setAttribute('segments-height', 8);
    tail.setAttribute('color', '#ff5d73');
    tail.setAttribute('position', '0 -0.11 0');
    el.appendChild(shaft);
    el.appendChild(tail);
    this.el.appendChild(el);

    var q = new CANNON.Quaternion();
    q.setFromEuler(-Math.PI / 2, 0, 0);               // lying down, tip toward the wall
    var body = new CANNON.Body({
      mass: 0.09,
      shape: new CANNON.Box(new CANNON.Vec3(this.DART_HALF, this.DART_LONG, this.DART_HALF)),
      position: new CANNON.Vec3(x, y, z),
      quaternion: q,
      linearDamping: 0.01,
      angularDamping: 0.3
    });
    body.sleepSpeedLimit = 0.15;
    body.sleepTimeLimit = 0.4;
    this.world.addBody(body);

    // Body and mesh are two separate things: the body is copied onto the mesh
    // every frame, and the starting quaternion is kept so a dart that goes home
    // lies down again instead of snapping upright.
    var d = {
      el: el, body: body, held: null, restT: 0, glow: false,
      home: { x: x, y: y, z: z, q: q.clone() },
      tip: new THREE.Vector3(), prevTip: new THREE.Vector3()
    };
    this.darts.push(d);
    this.tipOf(d, d.tip);
    d.prevTip.copy(d.tip);
    this.syncDart(d);
    return d;
  },

  syncDart: function (d) {
    var p = d.body.position, q = d.body.quaternion;
    d.el.object3D.position.set(p.x, p.y, p.z);
    d.el.object3D.quaternion.set(q.x, q.y, q.z, q.w);
  },

  // the sharp end, which is what a bubble feels
  tipOf: function (d, out) {
    var q = d.body.quaternion, p = d.body.position;
    out.set(0, this.DART_LONG, 0).applyQuaternion(this._q.set(q.x, q.y, q.z, q.w));
    out.x += p.x; out.y += p.y; out.z += p.z;
    return out;
  },

  freeDart: function () {
    for (var i = 0; i < this.darts.length; i++) if (!this.darts[i].held) return this.darts[i];
    return null;
  },

  nearestDart: function (point, reach) {
    var best = null, bestD = reach * reach;
    for (var i = 0; i < this.darts.length; i++) {
      var d = this.darts[i];
      if (d.held) continue;
      var p = d.body.position;
      var dx = p.x - point.x, dy = p.y - point.y, dz = p.z - point.z;
      var dist = dx * dx + dy * dy + dz * dz;
      if (dist < bestD) { best = d; bestD = dist; }
    }
    return best;
  },

  returnDart: function (d) {
    var h = d.home;
    d.body.type = CANNON.Body.DYNAMIC;
    d.body.position.set(h.x, h.y, h.z);
    d.body.quaternion.copy(h.q);
    d.body.velocity.set(0, 0, 0);
    d.body.angularVelocity.set(0, 0, 0);
    d.body.force.set(0, 0, 0);
    d.body.torque.set(0, 0, 0);
    d.restT = 0;
    d.body.wakeUp();
    this.tipOf(d, d.tip);
    d.prevTip.copy(d.tip);
    this.syncDart(d);
  },

  // --- picking up and throwing --------------------------------------------
  // The laser you see is the raycaster's ray, not the controller's -Z, so a
  // dart leaves the hand along exactly the line the player is aiming with.
  aimingAtSign: function (el) {
    var rc = el && el.components && el.components.raycaster;
    return !!(rc && rc.intersections && rc.intersections.length);
  },

  // In VR the real head pose lives on the camera object inside #head, never on
  // the entity — xr-kit's headObject() returns whichever is right.
  handObject: function (hand) {
    if (hand === 'head') {
      var kit = this.el.sceneEl.components['xr-kit'];
      var cam = (kit && kit.headObject && kit.headObject()) || null;
      if (cam) return cam;
      var head = document.querySelector('#head');
      return head && head.object3D;
    }
    var el = document.querySelector('#' + hand + '-hand');
    return el && el.object3D;
  },

  aimDirection: function (hand, out) {
    var el = hand === 'head' ? null : document.querySelector('#' + hand + '-hand');
    var rc = el && el.components && el.components.raycaster && el.components.raycaster.raycaster;
    if (rc) { out.copy(rc.ray.direction).normalize(); if (out.lengthSq() > 0.5) return out; }
    var obj = this.handObject(hand);
    if (!obj) return out.set(0, 0, -1);
    obj.getWorldQuaternion(this._q);
    return out.set(0, 0, -1).applyQuaternion(this._q).normalize();
  },

  grab: function (hand) {
    if (this.held[hand]) return;
    var obj = this.handObject(hand);
    if (!obj) return;
    if (hand !== 'head' && this.aimingAtSign(document.querySelector('#' + hand + '-hand'))) return;
    obj.updateWorldMatrix(true, false);
    obj.getWorldPosition(this._a);
    // A hand has to reach; the desktop player has no arms, so a click takes
    // whichever dart is nearest.
    var d = this.nearestDart(this._a, hand === 'head' ? 99 : this.GRAB_REACH);
    if (!d) return;
    this.setGlow(d, false);
    d.held = hand;
    d.restT = 0;
    d.body.type = CANNON.Body.KINEMATIC;             // it goes where the hand goes until it is let go
    d.body.allowSleep = false;
    d.body.wakeUp();
    d.body.velocity.set(0, 0, 0);
    d.body.angularVelocity.set(0, 0, 0);
    this.held[hand] = d;
    this.trails[hand].length = 0;
    this.holdDart(d);
  },

  holdDart: function (d) {
    var hand = d.held, obj = this.handObject(hand);
    if (!obj) return;
    obj.updateWorldMatrix(true, false);
    obj.getWorldPosition(this._a);
    this.aimDirection(hand, this._b);
    if (hand === 'head') { this._a.addScaledVector(this._b, 0.5); this._a.y -= 0.16; }  // out where it can be seen, not over the eyes
    else { this._a.addScaledVector(this._b, 0.08); }
    d.body.position.set(this._a.x, this._a.y, this._a.z);
    this._q.setFromUnitVectors(this._up, this._b);   // the cone's tip (+Y) leads
    d.body.quaternion.set(this._q.x, this._q.y, this._q.z, this._q.w);
    d.body.velocity.set(0, 0, 0);
    d.body.angularVelocity.set(0, 0, 0);
  },

  // Where the hand has been, so a release can read the speed of the swing.
  sampleHand: function (hand, time) {
    var obj = this.handObject(hand);
    if (!obj) return;
    obj.updateWorldMatrix(true, false);
    obj.getWorldPosition(this._a);
    var trail = this.trails[hand];
    trail.push({ t: time, x: this._a.x, y: this._a.y, z: this._a.z });
    if (trail.length > this.TRAIL) trail.shift();
  },

  // The release peak, not the average: check every window of 20–120 ms ending
  // at the last sample and keep the fastest. A flat average reads about
  // two-thirds of the real speed and the throw feels dead.
  trailVelocity: function (hand, out) {
    var trail = this.trails[hand];
    out.set(0, 0, 0);
    if (trail.length < 2) return out;
    var last = trail[trail.length - 1], best = 0;
    for (var i = trail.length - 2; i >= 0; i--) {
      var dt = (last.t - trail[i].t) / 1000;
      if (dt < 0.02) continue;
      if (dt > 0.12) break;
      var vx = (last.x - trail[i].x) / dt, vy = (last.y - trail[i].y) / dt, vz = (last.z - trail[i].z) / dt;
      var sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
      if (sp > best) { best = sp; out.set(vx, vy, vz); }
    }
    if (!best) {                                   // frames longer than the window (a hitch): use the last pair rather than drop the throw
      var prev = trail[trail.length - 2], span = Math.min(0.25, Math.max(0.008, (last.t - prev.t) / 1000));
      out.set((last.x - prev.x) / span, (last.y - prev.y) / span, (last.z - prev.z) / span);
    }
    out.multiplyScalar(this.THROW_GAIN);
    if (out.length() > this.MAX_SPEED) out.setLength(this.MAX_SPEED);
    return out;
  },

  // Desktop: the mouse can't swing, so the throw goes along the centre ring at
  // a set speed, lifted by exactly what gravity will take out of it on the way
  // to the wall — a click lands where the ring is pointing.
  aimedVelocity: function (origin, dir, speed, out) {
    var reach = Math.abs(this.data.z - origin.z) / Math.max(0.25, -dir.z);
    reach = Math.max(1.5, Math.min(6, reach));
    var tof = reach / speed;
    out.copy(dir).multiplyScalar(speed);
    out.y += 0.5 * this.GRAVITY * tof;
    if (out.length() > this.MAX_SPEED) out.setLength(this.MAX_SPEED);
    return out;
  },

  release: function (hand) {
    var d = this.held[hand];
    if (!d) return;
    this.held[hand] = null;
    d.held = null;
    d.restT = 0;
    d.body.type = CANNON.Body.DYNAMIC;
    d.body.allowSleep = true;
    d.body.wakeUp();

    if (hand === 'head') {
      var obj = this.handObject('head');
      obj.updateWorldMatrix(true, false);
      obj.getWorldPosition(this._a);
      this.aimDirection('head', this._b);
      this.aimedVelocity(this._a, this._b, 10.5, this._c);
    } else {
      this.trailVelocity(hand, this._c);
    }

    d.body.velocity.set(this._c.x, this._c.y, this._c.z);
    var sp = this._c.length();
    if (sp > 0.6) {
      this._b.copy(this._c).normalize();
      this._q.setFromUnitVectors(this._up, this._b);
      d.body.quaternion.set(this._q.x, this._q.y, this._q.z, this._q.w);
      d.body.angularVelocity.set(0, 0, 0);
    }
    if (sp > 1.5) { this.thrown++; this.startClock(); this.updateSign(); }   // anything slower was a drop, not a throw
    this.tipOf(d, d.tip);
    d.prevTip.copy(d.tip);
    this.syncDart(d);
  },

  // Used by the self-check: a dart thrown from where the player is standing,
  // straight at a bubble, with the lift gravity will take back out of it.
  throwAtBubble: function (index) {
    var THREE = AFRAME.THREE;
    var alive = this.bubbles.filter(function (b) { return b.alive; });
    var b = alive[index || 0], d = this.freeDart();
    if (!b || !d) return false;
    var obj = this.handObject('head');
    if (!obj) return false;
    obj.updateWorldMatrix(true, false);
    var origin = obj.getWorldPosition(new THREE.Vector3());
    origin.y -= 0.12;
    var target = new THREE.Vector3(b.x, b.y, b.z);
    var reach = target.distanceTo(origin);
    var speed = Math.min(this.MAX_SPEED, Math.max(8, reach * 4.2));
    var tof = reach / speed;
    var v = target.clone().sub(origin).divideScalar(tof);
    v.y += 0.5 * this.GRAVITY * tof;

    d.body.type = CANNON.Body.DYNAMIC;
    d.body.allowSleep = true;
    d.body.position.set(origin.x, origin.y, origin.z);
    this._q.setFromUnitVectors(this._up, this._b.copy(v).normalize());
    d.body.quaternion.set(this._q.x, this._q.y, this._q.z, this._q.w);
    d.body.velocity.set(v.x, v.y, v.z);
    d.body.angularVelocity.set(0, 0, 0);
    d.body.wakeUp();
    d.restT = 0;
    this.tipOf(d, d.tip);
    d.prevTip.copy(d.tip);
    this.syncDart(d);
    this.thrown++;
    this.startClock();
    this.updateSign();
    return true;
  },

  // A dart a hand could take right now lights up, so nobody has to guess.
  setGlow: function (d, on) {
    if (d.glow === on) return;
    d.glow = on;
    var kids = d.el.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].setAttribute('material', 'emissive', on ? '#ffd76a' : '#000000');
      kids[i].setAttribute('material', 'emissiveIntensity', on ? 0.75 : 0);
    }
  },

  // --- the wall -----------------------------------------------------------
  buildWall: function () {
    var d = this.data, i;
    for (i = 0; i < this.bubbles.length; i++) {
      var old = this.bubbles[i].el;
      if (old && old.parentNode) old.parentNode.removeChild(old);
    }
    this.bubbles = [];
    this.rebuildAt = 0;
    var gapX = 0.72, gapY = 0.5, baseY = 1.05;
    for (var r = 0; r < d.rows; r++) {
      for (var c = 0; c < d.cols; c++) {
        var x = (c - (d.cols - 1) / 2) * gapX;
        var y = baseY + r * gapY;
        var el = document.createElement('a-sphere');
        el.setAttribute('radius', this.RADIUS);
        el.setAttribute('segments-width', 16);
        el.setAttribute('segments-height', 12);
        el.setAttribute('color', this.COLORS[(r * d.cols + c) % this.COLORS.length]);
        el.setAttribute('opacity', 0.92);
        el.setAttribute('transparent', true);
        el.setAttribute('roughness', 0.25);
        el.setAttribute('metalness', 0);
        el.setAttribute('position', x + ' ' + y + ' ' + d.z);
        el.classList.add('bubble');
        this.el.appendChild(el);
        this.bubbles.push({
          el: el, alive: true, popT: 0,
          base: { x: x, y: y, z: d.z },
          x: x, y: y, z: d.z,                      // where it is right now, kept up to date by the bob
          phase: (r * d.cols + c) * 0.7
        });
      }
    }
  },

  // The clock starts on the first throw and stops when the round is over, so
  // a round is 30 seconds of throwing rather than 30 seconds of standing about.
  startClock: function () {
    if (this.over || this.running) return;
    this.running = true;
    this.updateClock();
  },

  endRound: function () {
    this.running = false;
    this.over = true;
    this.remaining = 0;
    this.updateClock();
    this.updateSign();
  },

  clockText: function () {
    var secs = Math.max(0, Math.ceil(this.remaining));
    return Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2);
  },

  // Redrawn only when the second on the face changes: a canvas texture upload
  // every frame is a waste of a mobile GPU.
  updateClock: function () {
    var el = document.querySelector('#timer');
    if (!el) return;
    var secs = Math.max(0, Math.ceil(this.remaining));
    if (secs === this.shownSecs && !this.over) return;
    this.shownSecs = secs;
    if (this.over) {
      el.setAttribute('canvas-sign', { title: 'Time!', sub: 'round over', bg: '#7a2740' });
      return;
    }
    el.setAttribute('canvas-sign', {
      title: this.clockText(),
      sub: this.running ? 'left' : 'throw to start',
      bg: secs <= 10 ? '#7a2740' : '#15324d'          // the last ten seconds turn red
    });
  },

  newGame: function () {
    this.popped = 0;
    this.thrown = 0;
    this.remaining = this.ROUND_SECS;
    this.running = false;
    this.over = false;
    this.shownSecs = -1;
    this.buildWall();
    for (var i = 0; i < this.darts.length; i++) {
      var d = this.darts[i];
      if (d.held) { this.held[d.held] = null; d.held = null; d.body.allowSleep = true; }
      this.returnDart(d);
    }
    this.updateSign();
    this.updateClock();
  },

  aliveCount: function () {
    var n = 0;
    for (var i = 0; i < this.bubbles.length; i++) if (this.bubbles[i].alive) n++;
    return n;
  },

  popBubble: function (b) {
    if (!b || !b.alive || this.over) return;
    b.alive = false;
    b.popT = 0;
    this.popped++;
    this.updateSign();
  },

  // --- the flight ---------------------------------------------------------
  // The tip is tested as the segment it swept this frame, so a fast dart can
  // never skip past a bubble between two frames.
  hitAlong: function (p0, p1) {
    var seg = this._d.copy(p1).sub(p0);
    var len2 = seg.lengthSq();
    var reach = this.RADIUS + this.TOLERANCE, best = null, bestT = 2;
    for (var i = 0; i < this.bubbles.length; i++) {
      var b = this.bubbles[i];
      if (!b.alive) continue;
      var t = 0;
      if (len2 > 1e-9) {
        t = ((b.x - p0.x) * seg.x + (b.y - p0.y) * seg.y + (b.z - p0.z) * seg.z) / len2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
      }
      var dx = p0.x + seg.x * t - b.x, dy = p0.y + seg.y * t - b.y, dz = p0.z + seg.z * t - b.z;
      if (dx * dx + dy * dy + dz * dz <= reach * reach && t < bestT) { best = b; bestT = t; }
    }
    return best;
  },

  tick: function (time, delta) {
    var dt = Math.min(delta || 16, 50) / 1000, i, b, d;

    // the round clock
    if (this.running && !this.over) {
      this.remaining -= dt;
      if (this.remaining <= 0) this.endRound();
      else this.updateClock();
    }

    // bubbles bob where they float, and popped ones swell and fade away
    for (i = this.bubbles.length - 1; i >= 0; i--) {
      b = this.bubbles[i];
      if (b.alive) {
        b.x = b.base.x + Math.sin(time * 0.0011 + b.phase * 1.7) * 0.04;
        b.y = b.base.y + Math.sin(time * 0.0016 + b.phase) * 0.06;
        b.el.object3D.position.set(b.x, b.y, b.z);
      } else {
        b.popT += dt;
        var k = Math.min(1, b.popT / 0.2);
        var s = 1 + k * 0.6;
        b.el.object3D.scale.set(s, s, s);
        b.el.setAttribute('opacity', 0.92 * (1 - k));
        if (k >= 1) {
          if (b.el.parentNode) b.el.parentNode.removeChild(b.el);
          this.bubbles.splice(i, 1);
        }
      }
    }

    // remember where each hand has been, and carry whatever it is holding
    ['left', 'right', 'head'].forEach(function (hand) {
      this.sampleHand(hand, time);
      if (this.held[hand]) this.holdDart(this.held[hand]);
    }, this);

    // 120 Hz: cannon-es has no continuous collision, so a coarser step lets a
    // fast dart pass straight through the floor or a rack.
    this.world.step(1 / 120, dt, 5);

    for (i = 0; i < this.darts.length; i++) {
      d = this.darts[i];
      d.prevTip.copy(d.tip);
      this.tipOf(d, d.tip);
      this.syncDart(d);
      if (d.held) continue;

      var v = d.body.velocity, sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
      if (sp > 1) {
        var hit = this.hitAlong(d.prevTip, d.tip);
        if (hit) this.popBubble(hit);
      }

      var p = d.body.position;
      if (p.y < -1 || Math.abs(p.x) > 12 || Math.abs(p.z) > 12) { this.returnDart(d); continue; }

      // a dart that has come to rest away from its rack finds its own way home
      if (sp < 0.25 || d.body.sleepState === CANNON.Body.SLEEPING) d.restT += dt;
      else d.restT = 0;
      if (d.restT > this.REST_SECS) {
        var h = d.home, dx = p.x - h.x, dy = p.y - h.y, dz = p.z - h.z;
        if (dx * dx + dy * dy + dz * dz > 0.12) this.returnDart(d);
        else d.restT = 0;
      }
    }

    // the dart each hand could pick up right now glows, so nobody has to guess
    var wanted = [];
    ['left', 'right'].forEach(function (hand) {
      if (this.held[hand]) return;
      var obj = this.handObject(hand);
      if (!obj) return;
      obj.getWorldPosition(this._a);
      var near = this.nearestDart(this._a, this.GRAB_REACH);
      if (near) wanted.push(near);
    }, this);
    for (i = 0; i < this.darts.length; i++) this.setGlow(this.darts[i], wanted.indexOf(this.darts[i]) >= 0);

    // a cleared wall fills again by itself, so nobody is ever left with nothing to pop
    if (this.aliveCount() === 0) {
      if (!this.rebuildAt) { this.rebuildAt = time + this.REBUILD_MS; this.updateSign(); }
      else if (time >= this.rebuildAt) { this.buildWall(); this.updateSign(); }
    }
  },

  // --- the scoreboard, drawn in the scene: the HTML panel is invisible in VR
  updateSign: function () {
    var el = document.querySelector('#score');
    if (!el) return;
    var left = this.aliveCount();
    if (this.over) {
      el.setAttribute('canvas-sign', {
        title: 'Time! Popped ' + this.popped,
        sub: 'press "Start again" for another 30 seconds'
      });
      return;
    }
    if (left === 0 && this.rebuildAt) {
      el.setAttribute('canvas-sign', { title: 'Wall cleared!', sub: 'a new wall in a moment…' });
      return;
    }
    el.setAttribute('canvas-sign', {
      title: 'Popped ' + this.popped,
      sub: left + (left === 1 ? ' bubble left' : ' bubbles left') + '  ·  ' + this.thrown + ' darts thrown'
    });
  }
});
</script>
</head>
<body>
<div id="kit-reticle"></div>

<div id="kit-panel"><b>Bubble Pop</b><span class="build">build …</span><span>starting…</span></div>

<!-- ======================================================================
     YOUR SCENE. Add objects below the rig. Coordinates are metres:
     x right, y up, z toward you — so negative z is in front of the player.
     The rig sits on the floor at 0 0 0; in a headset the runtime supplies
     the player's real eye height.
     ====================================================================== -->
<!-- xr-kit="dof: 6" — designed for 6DoF headsets (full tracking).
     xr-kit="dof: 3" — designed for 3DoF headsets: only turning counts. On a 6DoF
     headset the kit pins the eyes 1.6 m above the rig, hides the lasers, and any
     trigger selects what the player is looking at (right stick still turns). -->
<a-scene xr-kit="dof: 6"
  background="color: #bfe3f7"
  renderer="colorManagement: true; antialias: true; toneMapping: no"
  vr-mode-ui="enabled: true"
  device-orientation-permission-ui="enabled: true">

  <!-- ground and sky -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#a4d29a" checker-ground></a-plane>
  <a-sky color="#bfe3f7"></a-sky>

  <!-- light. three.js uses physical light units now — these values are
       roughly double what older tutorials suggest, and that is correct. -->
  <a-entity light="type: hemisphere; color: #ffffff; groundColor: #d8eed2; intensity: 2.25"></a-entity>
  <a-entity light="type: directional; color: #fff6e8; intensity: 1.5" position="3 5 2"></a-entity>

  <!-- XR rig: the player. Move this to move the player. -->
  <a-entity id="rig" position="0 0 0">
    <!-- #tracking is where the headset's own movement lands. Leave it alone: in a
         6DoF app it never moves; in a 3DoF app xr-kit repositions it every frame
         to cancel the head's movement. Head and hands must stay inside it. -->
    <a-entity id="tracking">
      <a-entity id="head" camera="active: true"
                look-controls="pointerLockEnabled: false"
                wasd-controls="acceleration: 20"
                position="0 1.6 0">
        <!-- gaze cursor: casts from the screen centre. Desktop: left-click = trigger.
             3DoF apps: also the headset's pointer — any trigger presses it. -->
        <a-entity id="gaze" cursor="fuse: false" raycaster="objects: .clickable; far: 40"></a-entity>
      </a-entity>
      <!-- model: false — the kit reads the sticks/buttons off the gamepad itself
           (see the tick loop). A-Frame's controller MODEL animation throws on
           ClassVR ("reading 'thumbstick'") because the model's named parts never
           load there; with no model that path is gone. The white laser line comes
           from the raycaster, not the model, so it stays. On the headset the kit
           re-aims the laser to the controller's real POINTING pose at runtime
           (see xr-kit tick); the `direction` below is only the fallback used
           before that measurement and on desktop. -->
      <a-entity id="left-hand"  laser-controls="hand: left; model: false"  raycaster="objects: .clickable; direction: 0 -0.82 -0.57"></a-entity>
      <a-entity id="right-hand" laser-controls="hand: right; model: false" raycaster="objects: .clickable; direction: 0 -0.82 -0.57"></a-entity>
    </a-entity>
  </a-entity>

  <!-- ADD YOUR CONTENT HERE -->

  <!-- Score and instructions have to be objects in the scene: the HTML panel
       above is invisible once the headset is on. -->
  <a-entity id="score" position="-0.55 2.72 -3.05"
            canvas-sign="width: 1.8; height: 0.5; title: Popped 0; sub: 15 bubbles left"></a-entity>

  <!-- The round clock, beside the score and readable from where the player stands. -->
  <a-entity id="timer" position="0.95 2.72 -3.05"
            canvas-sign="width: 0.9; height: 0.5; title: 0:30; sub: throw to start"></a-entity>

  <a-entity id="howto" position="0 0.78 -2.9"
            canvas-sign="width: 1.7; height: 0.24; bg: #1d4a6e; title: Grab a dart and throw it"></a-entity>

  <!-- Big, obvious, and always reachable, so a finished round is never a dead end. -->
  <a-entity id="new-wall" class="clickable" position="0 0.4 -2.9"
            canvas-sign="width: 1.0; height: 0.3; bg: #d94f6a; title: Start again"></a-entity>

  <!-- The wall of bubbles and the darts live here. -->
  <a-entity id="game" position="0 0 0" bubble-pop-game></a-entity>

</a-scene>

<script>
  // Status panel: what this browser can and can't do, plus live diagnostics.
  (function () {
    var el = document.getElementById('kit-panel');
    function row(label, state, note) {
      var cls = state === true ? 'ok' : state === false ? 'bad' : 'warn';
      var mark = state === true ? '✔' : state === false ? '✘' : '•';
      return '<div class="' + cls + '">' + mark + ' ' + label +
             (note ? ' <span style="opacity:.7">' + note + '</span>' : '') + '</div>';
    }
    var lines = [], xrLine = '', problemLine = '', checksLine = '', mailboxLine = '', flagLine = '';
    lines.push(row('Secure context', !!window.isSecureContext));
    lines.push(row('A-Frame', typeof AFRAME !== 'undefined',
                   typeof AFRAME !== 'undefined' ? 'v' + AFRAME.version + ' (bundled)' : 'aframe.min.js missing'));
    lines.push(row('navigator.xr', 'xr' in navigator));
    // Inside another page's frame (an artifact viewer, an LMS embed) WebXR is
    // blocked by the frame's permission policy: isSessionSupported throws
    // SecurityError and no VR button appears. The frame also blocks opening the
    // page on its own, so there is no way out from here — headsets use the
    // ClassCloud build (QR code), which is loaded top-level.
    var framed = false;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }

    function render() {
      el.innerHTML = '<b>Bubble Pop</b><span class="build">build ' + window.BUILD + '</span>' + targetLine()
        + lines.join('') + xrLine + problemLine + flagLine + checksLine + mailboxLine
        + controlsHtml();
    }
    // Which headset the app is designed for. A 3DoF app is played on a 6DoF
    // headset with the head pinned in place, so the person holding it knows
    // that walking about is meant to do nothing.
    function targetLine() {
      var s = document.querySelector('a-scene'), v = s && s.getAttribute('xr-kit');
      var three = (v && typeof v === 'object') ? v.dof === 3 : /dof\s*:\s*3/.test(String(v || ''));
      return '<div class="target">' + (three ? 'Designed for 3DoF headsets — only turning counts; walking about is ignored on purpose'
                                             : 'Designed for 6DoF headsets') + '</div>';
    }
    function controlsHtml() {
      var c = window.KIT_CONTROLS || {};
      var desktop = c.desktop || [];
      function list(title, items) {
        if (!items || !items.length) return '';
        return '<h4>' + title + '</h4><ul>' + items.map(function (t) {
          return '<li>' + String(t).replace(/</g, '&lt;') + '</li>';
        }).join('') + '</ul>';
      }
      return '<div class="sub">' + list('Headset', c.headset) + list('Desktop', desktop) + '</div>';
    }
    render();

    // Plain words when something breaks — the details are in the diary, for Claude.
    if (window.KIT) {
      window.KIT.on('error', function (entry, count) {
        if (!window.__kitFirstCode) window.__kitFirstCode = entry.code;
        var mb = window.KIT.mailbox && window.KIT.mailbox(), lb = window.KIT.logbook && window.KIT.logbook();
        var how = (mb && mb.on) ? '— Claude has the details'
                : (lb && lb.on && window.KIT.headsetBrowser && window.KIT.headsetBrowser()) ? '— exit to the ClassVR Launcher when finished and Claude can collect what happened'
                : '— tell Claude: "code ' + window.__kitFirstCode + '"';
        problemLine = row('Oops, something didn\'t work', false, how + (count > 1 ? ' (+' + (count - 1) + ' more)' : ''));
        render();
      });
      window.KIT.on('flag', function (entry, n) {
        var m = Math.floor(entry.t / 60), sec = Math.floor(entry.t % 60);
        flagLine = row('Marked a problem at ' + m + ':' + (sec < 10 ? '0' : '') + sec, null,
                       '— tell Claude what you saw' + (n > 1 ? ' (' + n + ' marks)' : ''));
        render();
      });
      window.KIT.on('mailbox', function (state, n) {
        mailboxLine = row(state === 'sent' ? 'Report sent to the app\'s creator' : 'Reports from this page go to the app\'s creator',
                          true, state === 'sent' && n > 1 ? '(' + n + ')' : '');
        render();
      });
      window.KIT.on('logbook', function (reason, n) {
        if (mailboxLine) return;                                             // the link already says reports reach the creator
        mailboxLine = row('Play record kept for the app\'s creator', true, /Android/i.test(navigator.userAgent) && 'xr' in navigator ? '(read from the headset log)' : '');
        render();
      });
      window.KIT.on('checks', function (results) {
        var bad = results.filter(function (r) { return !r.ok; });
        checksLine = bad.length
          ? bad.map(function (r) { return row('Check failed: ' + r.name, false, r.detail); }).join('')
          : row('All ' + results.length + ' self-checks passed', true);
        render();
      });
    }

    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then(function (s) {
        try { window.KIT.setImmersive(s); } catch (e) {}
        xrLine = row('immersive-vr', s, s ? 'press the VR button' : 'no VR device here'); render();
      }).catch(function (e) {
        var why = String(e && e.name || e);
        if (framed) why = 'blocked inside a frame — headsets: scan the QR code instead';
        xrLine = row('immersive-vr', false, why); render();
      });
    } else { xrLine = row('immersive-vr', false, 'no WebXR in this browser'); render(); }
  })();
</script>
</body>
</html>
